services:
  vault-browser:
    image: ghcr.io/atoxien/obsidian-browserui:latest
    # build: .                              # alternativ selbst bauen
    container_name: vault-browser
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      VAULT_PASSWORD: "bitte-ändern"        # Pflicht: Login-Passwort
      SESSION_SECRET: "langer-zufallswert"  # empfohlen: z.B. `openssl rand -hex 32`
      # SECURE_COOKIE: "1"                  # aktivieren, wenn hinter HTTPS-Reverse-Proxy
      # Adresse der Oberfläche erlauben, wenn sie nicht von diesem Server kommt (ohne Pfad),
      # z.B. die GitHub-Pages-Seite des Projekts oder deines Forks:
      # ALLOWED_ORIGINS: "https://<user>.github.io"
    volumes:
      - /pfad/zu/deinem/vault:/vault        # Container läuft als UID 1000 (user "node")
